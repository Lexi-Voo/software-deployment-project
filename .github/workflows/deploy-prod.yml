name: Deploy Production Backend to Azure

on:
  push:
    branches:
      - Production

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Production branch
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build production Docker image
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod ./backend

      - name: Push production Docker image to Azure Container Registry
        run: |
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Production Azure Container App
        run: |
          az containerapp update \
            --name gofly-backend-prod \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod