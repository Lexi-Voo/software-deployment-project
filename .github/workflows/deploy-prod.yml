# ============================================================
# Branch: Production
# Trigger: push/merge into Production (i.e. when a PR from Testing is merged)
# Flow: build & push to ACR → deploy backend to gofly-backend-prod
#       → deploy frontend to Vercel (production)
#
# No tests here — code has already passed unit + API + E2E in Testing.
# The production job focuses purely on fast, reliable delivery.
# ============================================================

name: Deploy to Production

on:
  push:
    branches:
      - Production   # fires when a PR from Testing is merged here

jobs:

  # Verify all branches have identical application code before deploying
  verify-code-sync:
    name: Verify code sync across branches
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all branches, not just current

      - name: Fetch all branches
        run: |
          git fetch origin Development
          git fetch origin Testing
          git fetch origin Production

      - name: Check src/ is identical across branches
        run: |
          git diff origin/Development origin/Testing -- src/ 
          git diff origin/Testing origin/Production -- src/
          git diff origin/Development origin/Production -- src/
      
      - name: Check backend/ is identical across branches
        run: |
          git diff origin/Development origin/Testing -- backend/ 
          git diff origin/Testing origin/Production -- backend/
          git diff origin/Development origin/Production -- backend/

      - name: Check package.json and index.html across branches
        run: |
          git diff origin/Development origin/Testing -- package.json index.html
          git diff origin/Testing origin/Production -- package.json index.html
          git diff origin/Development origin/Production -- package.json index.html

      - name: Check workflows are identical across branches
        run: |
          git diff origin/Development origin/Testing -- .github/workflows/
          git diff origin/Testing origin/Production -- .github/workflows/
          git diff origin/Development origin/Production -- .github/workflows/

      - name: Fail if differences found
        run: |
          if ! git diff --quiet origin/Development origin/Testing -- src/ backend/ public/ index.html package.json .github/workflows/; then
            echo "ERROR: Code differs between Development and Testing"
            exit 1
          fi
          if ! git diff --quiet origin/Development origin/Production -- src/ backend/ public/ index.html package.json .github/workflows/; then
            echo "ERROR: Code differs between Development and Production"
            exit 1
          fi
          if ! git diff --quiet origin/Testing origin/Production -- src/ backend/ public/ index.html package.json .github/workflows/; then
            echo "ERROR: Code differs between Testing and Production"
            exit 1
          fi
          echo "All branches have identical application code"

  # Build backend Docker image and deploy to prod container app
  deploy-backend:
    name: Deploy backend to prod
    needs: verify-code-sync  # ensure code is identical across branches before deploying
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: :prod (stable) + commit SHA (rollback)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:cache-prod
          cache-to: type=registry,ref=${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:cache-prod,mode=max

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Production gets higher max-replicas for real traffic.
      # min-replicas 1 keeps the container warm — no cold start for real users.
      - name: Deploy to production container app
        run: |
          az containerapp update \
            --name gofly-backend-prod \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/gofly-backend:prod-${{ github.sha }} \
            --set-env-vars \
              SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }} \
              REDIS_URL=${{ secrets.PROD_REDIS_URL }} \
              NODE_ENV=production \
            --min-replicas 1 \
            --max-replicas 10

  # Deploy frontend to Vercel 
  # Runs in parallel with backend deploy since they are independent (no need to wait)
  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: verify-code-sync  # ensure code is identical across branches before deploying
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build is validated here before handing off to Vercel
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_BACKEND_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Frontend to Vercel (production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke-test-prod:
    name: Smoke test production
    needs: [deploy-backend, deploy-frontend]  # wait for both backend + frontend to be deployed
    runs-on: ubuntu-latest

    steps:
      - name: Wait for prod container to start
        run: sleep 30
      
      - name: Check backend health
        run: |
          curl -f ${{ secrets.PROD_BACKEND_URL }}/health || exit 1

      - name: Check frontend is up
        run: |
          curl -f ${{ secrets.PROD_FRONTEND_URL }} || exit 1

      - name: Check API endpoint
        run: |
          curl -f "${{ secrets.PROD_BACKEND_URL }}/api/city?name=Paris" || exit 1
  